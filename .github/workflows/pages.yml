name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只发布一个版本，新推送取代尚未完成的旧部署。
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types, lint and tests
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static preview
        run: npm run build:preview
      # 仅上传静态目录，不配置项目服务密钥，不发布完整后端和本地环境文件。
      - name: Verify static artifact
        run: |
          test -f .preview-build/out/index.html
          test ! -d .preview-build/out/api
          if find .preview-build/out -type f -name '.env*' -print -quit | grep -q .; then
            echo 'Static artifact must not contain environment files'
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .preview-build/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
